name: Deploy BlitzMall Updates

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./shop-frontend
        run: npm ci

      # Web build only. The signed OTA bundle for phones is made on the owner's
      # PC (`npm run build` needs ~/.blitzmall/ota-signing-key.pem, which must
      # never live in CI) and committed under shop-frontend/ota/.
      - name: Build React App
        working-directory: ./shop-frontend
        run: npm run build:strict

      # electron-builder needs Windows Developer Mode enabled so 7-Zip can
      # create the symlinks inside its winCodeSign cache; without it the
      # extraction fails with "Cannot create symbolic link" and the build dies.
      - name: Enable Developer Mode (winCodeSign symlink support)
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - name: Publish Desktop Update (Electron)
        working-directory: ./shop-frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder -p always
