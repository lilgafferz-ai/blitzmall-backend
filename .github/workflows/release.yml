name: Deploy BlitzMall Updates

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        working-directory: ./shop-frontend
        run: npm ci

      - name: Build React App
        working-directory: ./shop-frontend
        run: npm run build

      - name: Publish Desktop Update (Electron)
        working-directory: ./shop-frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build -- -p always

      # The mobile app updates via the self-hosted OTA bundle committed to ota/
      # (served by /api/native-update on Render). Capgo cloud is only used if a
      # CAPGO_TOKEN secret is configured, so a missing token never fails the run.
      - name: Publish Android Update (Capgo OTA)
        if: ${{ secrets.CAPGO_TOKEN != '' }}
        working-directory: ./shop-frontend
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: npx @capgo/cli@latest bundle upload --token ${{ secrets.CAPGO_TOKEN }}
