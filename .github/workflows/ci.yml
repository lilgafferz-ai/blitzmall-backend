name: Node.js CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
    - run: npm ci
    # Backend tests run against the offline mock DB (MOCK_DB=1). CI runners
    # have no MongoDB, so without this every test file stalls ~5s+ on a
    # connection-refused before falling back to the same mock — slow and
    # timing-dependent. MOCK_DB=1 makes the suite fast and deterministic.
    - run: |
        set -o pipefail
        npm test -- --runInBand 2>&1 | tee /tmp/jest.log
      env:
        MOCK_DB: '1'
    # Surface failures as check-run annotations + upload the full log so a
    # red CI can be diagnosed without repo-admin access to the raw logs.
    - name: Surface backend test failures
      if: failure()
      run: |
        echo "::group::Jest failure summary"
        grep -nE '✕|●|FAIL|Tests:|Test Suites:' /tmp/jest.log | head -80 || true
        echo "::endgroup::"
        grep -E '^\s*✕' /tmp/jest.log | head -20 | while IFS= read -r l; do
          esc=$(printf '%s' "$l" | sed 's/%/%25/g; s/:/%3A/g; s/\r//g')
          echo "::error::FAILED TEST: $esc"
        done
      shell: bash
    - name: Upload backend test log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-log
        path: /tmp/jest.log
        retention-days: 7

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: shop-frontend/package-lock.json
    - run: npm ci
      working-directory: ./shop-frontend
    - run: CI=true npm test -- --watchAll=false
      working-directory: ./shop-frontend
    # Production build with warnings-as-errors — catches lint warnings (unused
    # vars etc.) that react-scripts build only treats as fatal under CI=true.
    # The release workflow builds the PC installer, so failing fast here keeps
    # a lint warning from silently blocking every PC/mobile update.
    - name: Strict production build (warnings-as-errors)
      run: npm run build:strict
      working-directory: ./shop-frontend
