services:
  - type: web
    name: blitzmall-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      # All secrets are set in the Render dashboard (Environment tab), never committed here.
      - key: JWT_SECRET
        sync: false
      - key: MPESA_ENV
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_MOCK_ENABLED
        sync: false
      - key: CALLBACK_URL
        sync: false
      # Google Custom Search (product image finder) — set in the dashboard
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false
      # Africa's Talking SMS for sign-in codes (AT_SENDER_ID only once approved)
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
      # Shows the sign-in code ON SCREEN when an SMS fails = anyone can sign into
      # any account, so it is OFF. Sign-in now requires a real delivered SMS.
      # EMERGENCY ONLY: if SMS delivery breaks and customers are locked out, set
      # this to "true" in the Render dashboard for an instant (no-code) toggle.
      - key: OTP_SCREEN_FALLBACK
        value: "false"
      # Random string; append ?secret=<same value> to CALLBACK_URL
      - key: MPESA_CALLBACK_SECRET
        sync: false
      # Firebase service-account JSON (raw or base64) for real device push
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: NODE_ENV
        value: production
