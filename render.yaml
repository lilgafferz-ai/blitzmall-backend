services:
  - type: web
    name: blitzmall-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      # All secrets are set in the Render dashboard (Environment tab), never committed here.
      - key: JWT_SECRET
        sync: false
      # Encrypts staff authenticator (TOTP) secrets; set once, before anyone enrols.
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: MPESA_ENV
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_MOCK_ENABLED
        sync: false
      - key: CALLBACK_URL
        sync: false
      # Google Custom Search (product image finder) — set in the dashboard
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false
      # Africa's Talking SMS for sign-in codes (AT_SENDER_ID only once approved)
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
      # Optional: the M-Pesa callback secret is derived from JWT_SECRET when unset
      - key: MPESA_CALLBACK_SECRET
        sync: false
      # KRA eTIMS VSCU/OSCU endpoint + key (only after KRA onboarding; empty = invoices queue)
      - key: ETIMS_VSCU_URL
        sync: false
      - key: ETIMS_VSCU_KEY
        sync: false
      # GitHub repo (owner/name) whose releases the PC app updates from via
      # /api/pc-update. Unset = yrngaffer/blitzmall-backend.
      - key: PC_RELEASES_REPO
        sync: false
      # Firebase service-account JSON (raw or base64) for real device push
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: NODE_ENV
        value: production
